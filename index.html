<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3f33" />
  <title>Ӏакъидатан Академия</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Ӏакъидатан Академия</div>
        <h1 id="page-title">Главная</h1>
      </div>
      <button id="theme-toggle" class="icon-btn" aria-label="Сменить тему">◐</button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" data-route="home"><span>⌂</span><small>Главная</small></button>
      <button class="nav-item" data-route="courses"><span>▤</span><small>Курсы</small></button>
      <button class="nav-item" data-route="favorites"><span>♡</span><small>Избранное</small></button>
      <button class="nav-item" data-route="profile"><span>◉</span><small>Профиль</small></button>
    </nav>
  </div>

  <template id="empty-template">
    <section class="card empty-state">
      <div class="empty-icon">✦</div>
      <h2></h2>
      <p></p>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
