<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3f33" />
  <title>Ӏакъидатан Академия</title>
  <link rel="stylesheet" href="styles.css?v=themefix-20260911-1728" />
  <style>
    .topbar{min-height:68px!important;padding:calc(9px + env(safe-area-inset-top)) 16px 9px!important;gap:12px!important}
    .brand-wrap{display:flex!important;align-items:center!important;gap:10px!important;min-width:0!important;flex:1!important}
    .brand-logo{display:block!important;width:44px!important;height:44px!important;flex:0 0 44px!important;border-radius:50%!important;object-fit:cover!important;background:#fff!important;border:1px solid rgba(183,151,88,.42)!important;box-shadow:0 3px 12px rgba(0,0,0,.14)!important}
    .brand-copy{min-width:0!important;display:flex!important;align-items:center!important}
    .eyebrow{font-family:Georgia,"Times New Roman",serif!important;font-size:18px!important;line-height:1.05!important;letter-spacing:.01em!important;text-transform:none!important;color:var(--gold)!important;font-weight:700!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    .topbar h1{display:none!important}
    .icon-btn{width:52px!important;height:52px!important;flex:0 0 52px!important;border-radius:16px!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:0!important;background:var(--surface)!important;border:1px solid var(--line)!important;color:var(--text)!important;overflow:hidden!important}
    .theme-symbol{display:block!important;width:30px!important;height:30px!important;line-height:30px!important;text-align:center!important;font-size:26px!important;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif!important;font-weight:400!important;letter-spacing:0!important;transform:none!important;white-space:nowrap!important}
    @media(max-width:380px){.eyebrow{font-size:16px!important}.brand-logo{width:42px!important;height:42px!important;flex-basis:42px!important}.topbar{padding-left:12px!important;padding-right:12px!important}.icon-btn{width:48px!important;height:48px!important;flex-basis:48px!important}.theme-symbol{font-size:25px!important}}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <img class="brand-logo" src="https://t.me/i/userpic/320/AkidatanAcademyAppBot.jpg?v=2" alt="Ӏакъидатан Академия" />
        <div class="brand-copy">
          <div class="eyebrow">ӀАКЪИДАТАН АКАДЕМИЯ</div>
          <h1 id="page-title">Главная</h1>
        </div>
      </div>
      <button id="theme-toggle" class="icon-btn" aria-label="Сменить тему" title="Сменить тему"></button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" data-route="home"><span>⌂</span><small>Главная</small></button>
      <button class="nav-item" data-route="courses"><span>▤</span><small>Курсы</small></button>
      <button class="nav-item" data-route="favorites"><span>♡</span><small>Избранное</small></button>
      <button class="nav-item" data-route="profile"><span>◉</span><small>Профиль</small></button>
    </nav>
  </div>
  <template id="empty-template"><section class="card empty-state"><div class="empty-icon">✦</div><h2></h2><p></p></section></template>
  <script src="app.js?v=themefix-20260911-1728"></script>
</body>
</html>
