<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d3f33" />
  <title>Ӏакъидатан Академия</title>
  <link rel="stylesheet" href="styles.css?v=fontscale-20260911-2150" />
  <style>
    .topbar{min-height:68px!important;padding:calc(9px + env(safe-area-inset-top)) 16px 9px!important;gap:12px!important}
    .brand-wrap{display:flex!important;align-items:center!important;gap:10px!important;min-width:0!important;flex:1!important}
    .brand-logo{display:block!important;width:44px!important;height:44px!important;flex:0 0 44px!important;border-radius:50%!important;object-fit:cover!important;background:#fff!important;border:1px solid rgba(183,151,88,.42)!important;box-shadow:0 3px 12px rgba(0,0,0,.14)!important}
    .brand-copy{min-width:0!important;display:flex!important;align-items:center!important}
    .eyebrow{font-family:Georgia,"Times New Roman",serif!important;font-size:calc(18px * var(--font-scale))!important;line-height:1.05!important;letter-spacing:.01em!important;text-transform:none!important;color:var(--gold)!important;font-weight:700!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
    .topbar h1{display:none!important}
    .icon-btn{width:52px!important;height:52px!important;flex:0 0 52px!important;border-radius:16px!important;display:flex!important;align-items:center!important;justify-content:center!important;padding:0!important;background:var(--surface)!important;border:1px solid var(--line)!important;color:var(--text)!important;overflow:hidden!important}
    .theme-symbol{display:block!important;width:30px!important;height:30px!important;line-height:30px!important;text-align:center!important;font-size:26px!important;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif!important;font-weight:400!important;letter-spacing:0!important;transform:none!important;white-space:nowrap!important}
    .icon-btn::before{content:none!important;display:none!important}
    @media(max-width:380px){.eyebrow{font-size:calc(16px * var(--font-scale))!important}.brand-logo{width:42px!important;height:42px!important;flex-basis:42px!important}.topbar{padding-left:12px!important;padding-right:12px!important}.icon-btn{width:48px!important;height:48px!important;flex-basis:48px!important}.theme-symbol{font-size:25px!important}}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <img class="brand-logo" src="https://t.me/i/userpic/320/AkidatanAcademyAppBot.jpg?v=2" alt="Ӏакъидатан Академия" />
        <div class="brand-copy">
          <div class="eyebrow">ӀАКЪИДАТАН АКАДЕМИЯ</div>
          <h1 id="page-title">Коьртаниг</h1>
        </div>
      </div>
      <button id="theme-toggle" class="icon-btn" aria-label="Сменить тему" title="Сменить тему"></button>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" data-route="home"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5z"/></svg></span><small>Коьрта агIо</small></button>
      <button class="nav-item" data-route="courses"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5z"/></svg></span><small>Курсаш</small></button>
      <button class="nav-item" data-route="favorites"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.4 5.4 0 0 0-7.6 0L12 5.8l-1.2-1.2a5.4 5.4 0 0 0-7.6 7.6L12 21l8.8-8.8a5.4 5.4 0 0 0 0-7.6z"/></svg></span><small>Хаьржинарш</small></button>
      <button class="nav-item" data-route="profile"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></span><small>Профиль</small></button>
    </nav>
  </div>
  <template id="empty-template"><section class="card empty-state"><div class="empty-icon">✦</div><h2></h2><p></p></section></template>
  <script src="app.js?v=fontscale-20260911-2150"></script>
</body>
</html>
